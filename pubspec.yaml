name: pulze
description: "Pulze Flutter Application"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  phosphor_flutter: ^2.0.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo_icon.png
    - assets/logo_text.png

  fonts:
    - family: Phosphor
      fonts:
        - asset: fonts/Phosphor.ttf
        - asset: fonts/Phosphor-Bold.ttf
          weight: 700
        - asset: fonts/Phosphor-Light.ttf
          weight: 300
        - asset: fonts/Phosphor-Thin.ttf
          weight: 100
