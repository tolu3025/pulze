name: pulze
description: "Pulze Flutter Application"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  phosphor_flutter: ^2.0.0
  image_picker: ^1.0.7
  provider: ^6.1.2
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  intl: ^0.19.0
  http: ^1.2.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo_icon.png
    - assets/logo_text.png
